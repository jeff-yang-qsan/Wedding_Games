<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最小化測試</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; border-left: 4px solid #28a745; }
        .error { background: #f8d7da; border-left: 4px solid #dc3545; }
        .info { background: #d1ecf1; border-left: 4px solid #17a2b8; }
    </style>
</head>
<body>
    <h1>數字抽籤遊戲 - 最小化測試</h1>
    <div id="status">正在測試...</div>
    <div id="log"></div>
    <button onclick="runTest()">重新測試</button>
    <button onclick="location.href='index.html'">返回主遊戲</button>

    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('log').appendChild(div);
            console.log(message);
        }

        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        async function runTest() {
            document.getElementById('log').innerHTML = '';
            updateStatus('開始測試...', 'info');
            
            try {
                // 測試 1: 基本 DOM 操作
                log('✓ DOM 操作正常');
                
                // 測試 2: 載入單一檔案
                log('測試載入 storage-manager.js...');
                await loadScript('assets/js/storage-manager.js');
                
                if (typeof StorageManager !== 'undefined') {
                    log('✓ StorageManager 載入成功');
                    
                    // 測試實例化
                    const storage = new StorageManager();
                    log('✓ StorageManager 可實例化');
                } else {
                    log('✗ StorageManager 未定義', 'error');
                }
                
                // 測試 3: 載入 ErrorHandler
                log('測試載入 error-handler.js...');
                await loadScript('assets/js/error-handler.js');
                
                if (typeof ErrorHandler !== 'undefined') {
                    log('✓ ErrorHandler 載入成功');
                    
                    const errorHandler = new ErrorHandler();
                    log('✓ ErrorHandler 可實例化');
                    
                    // 不要初始化 ErrorHandler，因為這可能觸發錯誤
                    log('跳過 ErrorHandler.init() 以避免觸發錯誤處理');
                } else {
                    log('✗ ErrorHandler 未定義', 'error');
                }
                
                updateStatus('測試完成', 'success');
                
            } catch (error) {
                log(`✗ 測試失敗: ${error.message}`, 'error');
                updateStatus('測試失敗', 'error');
                console.error('詳細錯誤:', error);
            }
        }
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                // 檢查是否已經載入
                const existing = document.querySelector(`script[src="${src}"]`);
                if (existing) {
                    existing.remove();
                }
                
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Failed to load ${src}`));
                document.head.appendChild(script);
            });
        }

        // 捕獲全域錯誤
        window.addEventListener('error', (event) => {
            log(`全域錯誤: ${event.message} (${event.filename}:${event.lineno})`, 'error');
            updateStatus('檢測到全域錯誤', 'error');
        });

        window.addEventListener('unhandledrejection', (event) => {
            log(`Promise 拒絕: ${event.reason}`, 'error');
            updateStatus('檢測到 Promise 拒絕', 'error');
        });

        // 自動開始測試
        document.addEventListener('DOMContentLoaded', runTest);
    </script>
</body>
</html>
